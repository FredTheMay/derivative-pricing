<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">
    Monte Carlo European Call: Standard Error vs. Path Count (log-log)
  </text>

  <!-- Y gridlines + labels -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="90" y1="61.6" x2="660" y2="61.6"/>
    <line x1="90" y1="145.8" x2="660" y2="145.8"/>
    <line x1="90" y1="230.0" x2="660" y2="230.0"/>
    <line x1="90" y1="314.2" x2="660" y2="314.2"/>
    <line x1="90" y1="398.4" x2="660" y2="398.4"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="end">
    <text x="84" y="65.6">10^-0.2</text>
    <text x="84" y="149.8">10^-0.6</text>
    <text x="84" y="234.0">10^-1.0</text>
    <text x="84" y="318.2">10^-1.4</text>
    <text x="84" y="402.4">10^-1.8</text>
  </g>

  <!-- X gridlines + labels -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="123.5" y1="30" x2="123.5" y2="430"/>
    <line x1="291.2" y1="30" x2="291.2" y2="430"/>
    <line x1="458.8" y1="30" x2="458.8" y2="430"/>
    <line x1="626.5" y1="30" x2="626.5" y2="430"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="123.5" y="448">10^3</text>
    <text x="291.2" y="448">10^4</text>
    <text x="458.8" y="448">10^5</text>
    <text x="626.5" y="448">10^6</text>
  </g>

  <!-- Axes -->
  <line x1="90" y1="30" x2="90" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="430" x2="660" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="375" y="475" text-anchor="middle" font-size="13" fill="#1a1a1a">Path count N</text>
  <text x="22" y="230" text-anchor="middle" font-size="13" fill="#1a1a1a" transform="rotate(-90 22 230)">Standard error</text>

  <!-- Fitted line, slope = -0.5065 (theoretical O(1/sqrt(N)) rate: -0.5) -->
  <line x1="123.5" y1="70.3" x2="626.5" y2="390.2" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Measured data points -->
  <g fill="#2166ac" stroke="#ffffff" stroke-width="1.5">
    <circle cx="123.5" cy="68.8" r="5"/>
    <circle cx="203.5" cy="120.5" r="5"/>
    <circle cx="291.2" cy="179.1" r="5"/>
    <circle cx="371.2" cy="229.0" r="5"/>
    <circle cx="458.8" cy="284.0" r="5"/>
    <circle cx="538.8" cy="334.0" r="5"/>
    <circle cx="626.5" cy="389.1" r="5"/>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#1a1a1a">
    <circle cx="480" cy="55" r="5" fill="#2166ac" stroke="#ffffff" stroke-width="1.5"/>
    <text x="492" y="59">Measured SE (7 runs, seed=2024)</text>
    <line x1="470" y1="75" x2="490" y2="75" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="492" y="79">Least-squares fit: slope = -0.5065</text>
  </g>

  <text x="375" y="495" text-anchor="middle" font-size="11" fill="#777777">
    S=100, K=100, r=5%, q=2%, sigma=25%, T=1y. Data: tests/convergence_test.cpp.
  </text>
</svg>
