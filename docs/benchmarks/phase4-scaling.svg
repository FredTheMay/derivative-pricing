<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">
    Thread-Scaling: Speedup vs. Worker Count (European, 2*10^7 paths)
  </text>

  <!-- Gridlines -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="90" y1="363.3" x2="660" y2="363.3"/>
    <line x1="90" y1="296.7" x2="660" y2="296.7"/>
    <line x1="90" y1="230.0" x2="660" y2="230.0"/>
    <line x1="90" y1="163.3" x2="660" y2="163.3"/>
    <line x1="90" y1="96.7"  x2="660" y2="96.7"/>
    <line x1="185.0" y1="30" x2="185.0" y2="430"/>
    <line x1="280.0" y1="30" x2="280.0" y2="430"/>
    <line x1="375.0" y1="30" x2="375.0" y2="430"/>
    <line x1="470.0" y1="30" x2="470.0" y2="430"/>
    <line x1="565.0" y1="30" x2="565.0" y2="430"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="end">
    <text x="84" y="367.3">2</text>
    <text x="84" y="300.7">4</text>
    <text x="84" y="234.0">6</text>
    <text x="84" y="167.3">8</text>
    <text x="84" y="100.7">10</text>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="185.0" y="448">2</text>
    <text x="280.0" y="448">4</text>
    <text x="375.0" y="448">6</text>
    <text x="470.0" y="448">8</text>
    <text x="565.0" y="448">10</text>
  </g>

  <!-- Axes -->
  <line x1="90" y1="30" x2="90" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="430" x2="660" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="375" y="475" text-anchor="middle" font-size="13" fill="#1a1a1a">Worker threads (N)</text>
  <text x="22" y="230" text-anchor="middle" font-size="13" fill="#1a1a1a" transform="rotate(-90 22 230)">Speedup (T1/TN)</text>

  <!-- Ideal linear speedup -->
  <line x1="90.0" y1="430.0" x2="612.5" y2="63.3" stroke="#999999" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Amdahl fit, f=0.088 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2"
    points="137.5,396.7 185.0,368.7 232.5,345.0 280.0,324.5 327.5,306.7 375.0,291.1 422.5,277.3 470.0,265.0 517.5,253.9 565.0,244.0 612.5,235.0"/>

  <!-- Measured speedup (N=1..11, physical core count; num_threads > 11 not plotted --
       logical_chunk_count() is fixed at hardware_concurrency()=11, so higher thread
       counts have no additional chunks to process and any apparent movement there is
       measurement noise from this being a shared dev machine, not real scaling) -->
  <polyline fill="none" stroke="#2166ac" stroke-width="2"
    points="137.5,396.7 185.0,366.4 232.5,335.5 280.0,304.6 327.5,309.3 375.0,266.2 422.5,262.9 470.0,266.2 517.5,266.2 565.0,265.6 612.5,231.1"/>
  <g fill="#2166ac" stroke="#ffffff" stroke-width="1.5">
    <circle cx="137.5" cy="396.7" r="4.5"/>
    <circle cx="185.0" cy="366.4" r="4.5"/>
    <circle cx="232.5" cy="335.5" r="4.5"/>
    <circle cx="280.0" cy="304.6" r="4.5"/>
    <circle cx="327.5" cy="309.3" r="4.5"/>
    <circle cx="375.0" cy="266.2" r="4.5"/>
    <circle cx="422.5" cy="262.9" r="4.5"/>
    <circle cx="470.0" cy="266.2" r="4.5"/>
    <circle cx="517.5" cy="266.2" r="4.5"/>
    <circle cx="565.0" cy="265.6" r="4.5"/>
    <circle cx="612.5" cy="231.1" r="4.5"/>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#1a1a1a">
    <line x1="470" y1="52" x2="490" y2="52" stroke="#999999" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="496" y="56">Ideal linear speedup</text>
    <circle cx="480" cy="72" r="4.5" fill="#2166ac" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="470" y1="72" x2="490" y2="72" stroke="#2166ac" stroke-width="2"/>
    <text x="496" y="76">Measured (median of 5 runs)</text>
    <line x1="470" y1="92" x2="490" y2="92" stroke="#c0392b" stroke-width="2"/>
    <text x="496" y="96">Amdahl fit, f=0.088</text>
  </g>

  <text x="375" y="495" text-anchor="middle" font-size="11" fill="#777777">
    Apple M3 Pro (5P+6E, 11 physical cores), GCC 16 -O3, Release. Speedup at N=11: 5.97x (54.2% efficiency).
  </text>
</svg>
